<div class="modal-overlay" (click)="closeModal()" role="button" tabindex="0" (keydown.enter)="closeModal()">
    <div class="modal" 
        (click)="$event.stopPropagation()" 
        role="dialog"
        (keydown.enter)="$event.stopPropagation()">
        <div class="modal__header">
            <h2>{{ task() ? 'Edit task' : 'Add a task' }}</h2>
            <button class="modal__close" (click)="closeModal()">✕</button>
        </div>

        <form [formGroup]="taskForm" (ngSubmit)="saveTask()">
            <div class="form-group">
            <label for="task-title">Title</label>
            <input
                id="task-title"
                type="text"
                formControlName="title"
                placeholder="Enter task title" />
            @if (taskForm.get('title')?.invalid && taskForm.get('title')?.touched) {
                <span class="error">Title is required</span>
            }
            </div>

            <div class="form-group">
            <label for="task-desc">Description</label>
            <textarea
                id="task-desc"
                formControlName="description"
                placeholder="Add a description..."
                rows="3">
            </textarea>
            </div>

            <div class="modal__actions">
            <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
            <button type="submit" class="btn-save" [disabled]="taskForm.invalid || isSubmitting()">
                {{ isSubmitting() ? 'Saving...' : task() ? 'Save changes' : 'Add card' }}
            </button>
            </div>
        </form>
    </div>
</div>
