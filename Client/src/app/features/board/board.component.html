<div class="board-wrap">

  <div class="board-header">
    <h1 class="board-title">My Board:</h1>
    
    @if (isChangeTitle()) {
      <input 
        type="text"
        #titleInput
        class="board-title-name"
        (blur)="saveTitle($event)"  
        [value]="boardTitle()" />
    }
    @else {
      <button type="button" class="board-title-name" (click)="changeBoardTitle($event)">{{ boardTitle() }}</button>
    }
    
  </div>

  @if (isLoading()) {
    <div class="loading">Loading board...</div>
  }

  @if (errorMessage()) {
    <div class="error-banner">{{ errorMessage() }}</div>
  }

  <div class="columns">
    @for (boardList of boardLists(); track boardList.id) {
      <app-board-list
        [boardList]="boardList"
        (boardListDrop)="onTaskDrop($event, boardList.id)" />
    }

    <app-add-board-list-card>
    </app-add-board-list-card>
  </div>
</div>
